[project]
name = "tc-mcp"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "looMl", email = "landolfo.l@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic-settings>=2.6",
]

[project.scripts]
tc-mcp = "tc_mcp:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the live TrueConnector stack"]
addopts = "-m 'not integration'"
